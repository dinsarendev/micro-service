spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        multiTenancy: SCHEMA
        multi_tenant_connection_provider: com.example.erp.tenant.SchemaMultiTenantConnectionProvider
        tenant_identifier_resolver: com.example.erp.tenant.HeaderTenantIdentifierResolver
  flyway:
    enabled: true
    default-schema: public
    locations: classpath:db/migration/public

server:
  port: 8080

app:
  jwt:
    secret: replace-with-64-char-secret-replace-with-64-char-secret
    expiration-ms: 86400000
  tenancy:
    header: X-Tenant-ID
